      <circle cx="1075" cy="90" r="30" fill="url(#c6)" fill-opacity="0.18"/>
      <text x="1075" y="102" font-size="34" text-anchor="middle">🗄️</text>
      <text x="1075" y="150" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">MongoDB</text>
      <text x="1075" y="174" font-size="12.5" fill="#b7b3e6" text-anchor="middle">16 model</text>
      <text x="1075" y="192" font-size="12.5" fill="#b7b3e6" text-anchor="middle">Idempotent seed</text>
