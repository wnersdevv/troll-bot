      <text x="880" y="174" font-size="12.5" fill="#b7b3e6" text-anchor="middle">Seviye 100 atlama</text>
      <text x="880" y="192" font-size="12.5" fill="#b7b3e6" text-anchor="middle">Rozet + Basari</text>
