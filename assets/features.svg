      <text x="120" y="102" font-size="34" text-anchor="middle">💰</text>
      <text x="120" y="150" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Ekonomi</text>
      <text x="120" y="174" font-size="12.5" fill="#b7b3e6" text-anchor="middle">Cep + Banka</text>
      <text x="120" y="192" font-size="12.5" fill="#b7b3e6" text-anchor="middle">Atomik islemler</text>
    </g>

    <g>
