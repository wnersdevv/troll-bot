      <circle cx="500" cy="90" r="30" fill="url(#c3)" fill-opacity="0.18"/>
      <text x="500" y="102" font-size="34" text-anchor="middle">🎁</text>
      <text x="500" y="150" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Market &amp; Kasa</text>
      <text x="500" y="174" font-size="12.5" fill="#b7b3e6" text-anchor="middle">7 rarity seviyesi</text>
      <text x="500" y="192" font-size="12.5" fill="#b7b3e6" text-anchor="middle">Agirlikli RNG</text>
