      <stop offset="0%" stop-color="#141327"/>
      <stop offset="100%" stop-color="#1f1a3d"/>
    </linearGradient>
    <linearGradient id="c1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff6ec4"/><stop offset="100%" stop-color="#7873f5"/></linearGradient>
    <linearGradient id="c2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4adede"/><stop offset="100%" stop-color="#3a8bfd"/></linearGradient>
    <linearGradient id="c3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffd76e"/><stop offset="100%" stop-color="#ff8a5c"/></linearGradient>
    <linearGradient id="c4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8affc1"/><stop offset="100%" stop-color="#33c481"/></linearGradient>
    <linearGradient id="c5" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#c58cff"/><stop offset="100%" stop-color="#7c4dff"/></linearGradient>
    <linearGradient id="c6" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff8ac2"/><stop offset="100%" stop-color="#ff5c8a"/></linearGradient>
