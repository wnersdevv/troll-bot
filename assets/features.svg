      <text x="310" y="102" font-size="34" text-anchor="middle">🎮</text>
      <text x="310" y="150" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Mini Oyunlar</text>
      <text x="310" y="174" font-size="12.5" fill="#b7b3e6" text-anchor="middle">8 farkli oyun</text>
      <text x="310" y="192" font-size="12.5" fill="#b7b3e6" text-anchor="middle">Galibiyet serisi</text>
