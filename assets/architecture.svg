<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="abg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111022"/>
      <stop offset="100%" stop-color="#1c1836"/>
    </linearGradient>
    <linearGradient id="node1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7873f5"/><stop offset="100%" stop-color="#4adede"/></linearGradient>
    <linearGradient id="node2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff6ec4"/><stop offset="100%" stop-color="#ff8a5c"/></linearGradient>
    <linearGradient id="node3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8affc1"/><stop offset="100%" stop-color="#33c481"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8f8ac9"/>
    </marker>
  </defs>

  <rect width="1200" height="380" rx="20" fill="url(#abg)"/>
  <text x="600" y="42" font-family="Verdana, Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Istek Akisi</text>

  <!-- Discord -->
  <rect x="40" y="150" width="160" height="80" rx="16" fill="url(#node1)"/>
  <text x="120" y="185" font-family="Verdana, Arial, sans-serif" font-size="28" text-anchor="middle">💬</text>
  <text x="120" y="213" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#0f0c29" font-weight="bold" text-anchor="middle">Discord</text>

  <line x1="200" y1="190" x2="255" y2="190" stroke="#8f8ac9" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- wnersdev.js -->
  <rect x="260" y="150" width="170" height="80" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="url(#node1)" stroke-width="1.5"/>
  <text x="345" y="182" font-family="Verdana, Arial, sans-serif" font-size="26" text-anchor="middle">⚙️</text>
  <text x="345" y="210" font-family="Verdana, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">wnersdev.js</text>
  <text x="345" y="224" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#b7b3e6" text-anchor="middle">bootstrap</text>

  <line x1="430" y1="190" x2="485" y2="190" stroke="#8f8ac9" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- handlers -->
  <rect x="490" y="150" width="170" height="80" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="url(#node2)" stroke-width="1.5"/>
  <text x="575" y="182" font-family="Verdana, Arial, sans-serif" font-size="26" text-anchor="middle">🧭</text>
  <text x="575" y="210" font-family="Verdana, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">handlers/</text>
  <text x="575" y="224" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#b7b3e6" text-anchor="middle">komut + event yukleyici</text>

  <line x1="660" y1="190" x2="715" y2="190" stroke="#8f8ac9" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- commands/events -->
  <rect x="720" y="150" width="180" height="80" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="url(#node2)" stroke-width="1.5"/>
  <text x="810" y="182" font-family="Verdana, Arial, sans-serif" font-size="26" text-anchor="middle">🎛️</text>
  <text x="810" y="210" font-family="Verdana, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">commands / events</text>
  <text x="810" y="224" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#b7b3e6" text-anchor="middle">35 slash komut</text>

  <line x1="900" y1="190" x2="955" y2="190" stroke="#8f8ac9" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- services -->
  <rect x="960" y="150" width="200" height="80" rx="16" fill="url(#node3)"/>
  <text x="1060" y="182" font-family="Verdana, Arial, sans-serif" font-size="26" text-anchor="middle">🧩</text>
  <text x="1060" y="210" font-family="Verdana, Arial, sans-serif" font-size="13" fill="#0f0c29" font-weight="bold" text-anchor="middle">services/</text>
  <text x="1060" y="224" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#123" text-anchor="middle">ekonomi, log, rate-limit</text>

  <!-- down to db / canvas -->
  <line x1="810" y1="230" x2="810" y2="270" stroke="#8f8ac9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1060" y1="230" x2="1060" y2="270" stroke="#8f8ac9" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- canvas -->
  <rect x="700" y="275" width="220" height="70" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="url(#node1)" stroke-width="1.5"/>
  <text x="740" y="317" font-family="Verdana, Arial, sans-serif" font-size="24" text-anchor="middle">🖼️</text>
  <text x="840" y="310" font-family="Verdana, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">canvas/</text>
  <text x="840" y="326" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#b7b3e6" text-anchor="middle">profil / liderlik karti</text>

  <!-- mongo -->
  <rect x="960" y="275" width="200" height="70" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="url(#node1)" stroke-width="1.5"/>
  <text x="1000" y="317" font-family="Verdana, Arial, sans-serif" font-size="24" text-anchor="middle">🗄️</text>
  <text x="1090" y="310" font-family="Verdana, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">MongoDB</text>
  <text x="1090" y="326" font-family="Verdana, Arial, sans-serif" font-size="10.5" fill="#b7b3e6" text-anchor="middle">16 Mongoose modeli</text>
</svg>
