<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="45%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6ec4"/>
      <stop offset="50%" stop-color="#7873f5"/>
      <stop offset="100%" stop-color="#4adede"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd76e"/>
      <stop offset="100%" stop-color="#ff8a5c"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7873f5" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7873f5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4adede" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4adede" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <circle cx="150" cy="90" r="180" fill="url(#glow1)" filter="url(#soft)"/>
  <circle cx="1080" cy="360" r="220" fill="url(#glow2)" filter="url(#soft)"/>

  <!-- subtle grid dots -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="60" cy="60" r="2"/><circle cx="120" cy="60" r="2"/><circle cx="180" cy="60" r="2"/>
    <circle cx="60" cy="110" r="2"/><circle cx="120" cy="110" r="2"/><circle cx="180" cy="110" r="2"/>
    <circle cx="1020" cy="320" r="2"/><circle cx="1080" cy="320" r="2"/><circle cx="1140" cy="320" r="2"/>
    <circle cx="1020" cy="370" r="2"/><circle cx="1080" cy="370" r="2"/><circle cx="1140" cy="370" r="2"/>
  </g>

  <!-- floating card shapes for "components" feel -->
  <g opacity="0.9">
    <rect x="70" y="270" width="150" height="60" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="url(#accent1)" stroke-width="1.5"/>
    <text x="145" y="306" font-family="Verdana, Arial, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle">🎮</text>

    <rect x="960" y="60" width="150" height="60" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="url(#accent2)" stroke-width="1.5"/>
    <text x="1035" y="96" font-family="Verdana, Arial, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle">💰</text>
  </g>

  <!-- Emoji mascot -->
  <text x="600" y="150" font-family="Verdana, Arial, sans-serif" font-size="78" text-anchor="middle">🤡</text>

  <!-- Title -->
  <text x="600" y="235" font-family="Verdana, Arial, sans-serif" font-weight="bold" font-size="58" fill="#ffffff" text-anchor="middle">wnersdev Troll</text>

  <!-- Accent underline -->
  <rect x="420" y="252" width="360" height="6" rx="3" fill="url(#accent1)"/>

  <!-- Subtitle -->
  <text x="600" y="296" font-family="Verdana, Arial, sans-serif" font-size="21" fill="#c9c6f2" text-anchor="middle">Slash-only • MongoDB • Components V2 • Canvas Kartlari</text>

  <!-- pill badges -->
  <g font-family="Verdana, Arial, sans-serif" font-size="15" fill="#0f0c29" font-weight="bold">
    <rect x="330" y="330" width="118" height="34" rx="17" fill="url(#accent1)"/>
    <text x="389" y="352" text-anchor="middle">35 Komut</text>

    <rect x="460" y="330" width="150" height="34" rx="17" fill="url(#accent2)"/>
    <text x="535" y="352" text-anchor="middle">🇹🇷 Turkce Odakli</text>

    <rect x="622" y="330" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.9"/>
    <text x="697" y="352" text-anchor="middle">100% Eglence Amacli</text>
  </g>
</svg>
